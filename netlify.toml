
[build]
  command = "npm run build:clean"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18.17.1"
  NPM_VERSION = "9.6.7"
  NPM_FLAGS = "--legacy-peer-deps --no-audit"
  NEXT_TELEMETRY_DISABLED = "1"

[build.processing]
  skip_processing = true

[functions]
  included_files = ["node_modules/**"]
